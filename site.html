<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    Duo EnPassant old homepage redirect.
    GitHub Pages is static hosting, so this uses an instant meta refresh.
    Google interprets a 0-second meta refresh as a permanent redirect.
  -->
  <meta http-equiv="refresh" content="0; url=https://www.duoenpassant.com/">

  <link rel="canonical" href="https://www.duoenpassant.com/">
  <title>Duo EnPassant</title>

  <script>
    // Browser fallback in case meta refresh is not followed.
    window.location.replace("https://www.duoenpassant.com/");
  </script>
</head>

<body>
  <p>
    This page has moved to
    <a href="https://www.duoenpassant.com/">duoenpassant.com</a>.
  </p>
</body>
</html>
