  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MusicGroup",
    "name": "Duo EnPassant",
    "url": "https://www.duoenpassant.com/",
    "description": "Viiul ja tšello duo pulmadeks, matusteks ja üritusteks Tallinnas ja üle Eesti.",
    "genre": "Classical",
    "email": "info@duoenpassant.com",
    "member": [
      { "@type": "Person", "name": "Merily Leotoots", "jobTitle": "Viiuldaja" },
      { "@type": "Person", "name": "Anna Ryland-Jones", "jobTitle": "Tšellist" }
    ],
    "sameAs": [
      "https://www.instagram.com/duo_enpassant",
      "https://www.facebook.com/profile.php?id=61576658983538",
      "https://www.youtube.com/@DuoEnPassant",
      "https://www.tiktok.com/@duo.enpassant"
    ]
  }
  </script>

  <link rel="preload" as="image" href="001.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;500&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --ink: #1a1614;
      --parchment: #f5f0e8;
      --warm: #c8a96e;
      --muted: #7a6f65;
      --line: rgba(200,169,110,0.4);
    }

    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Background photo */
    .bg-photo {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      background-color: #b2a08f;
    }
    .bg-photo.mobile-contain {
      object-fit: contain;
      object-position: center bottom;
    }

    /* Overlay */
    .bg-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(to bottom,
        rgba(26,22,20,0.30) 0%,
        rgba(26,22,20,0.15) 30%,
        rgba(26,22,20,0.35) 70%,
        rgba(26,22,20,0.55) 100%);
      z-index: 1;
    }

    /* Main container */
    .landing {
      position: relative; z-index: 3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 10vh;
    }

    /* Language switcher */
    .lang-row {
      position: absolute; top: 1.8rem; right: 2.2rem;
      display: flex; align-items: center; gap: 0.5rem;
      z-index: 4;
    }
    .lang-btn {
      cursor: pointer; background: none;
      border: 1px solid transparent;
      color: rgba(245,240,232,0.6);
      font-family: 'Cinzel', serif; font-size: 0.82rem; letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: color 0.2s, border-color 0.2s;
      padding: 0.3rem 0.75rem; border-radius: 2px;
    }
    .lang-btn:hover { color: rgba(245,240,232,0.9); }
    .lang-btn.active { color: var(--warm); border-color: var(--line); }
    .lang-separator { color: rgba(200,169,110,0.35); font-size: 0.82rem; font-family: 'Cinzel', serif; }

    /* Title block — always centred */
    .landing-content {
      text-align: center;
      opacity: 0; transform: translateY(28px);
    }
    .landing-content.ready {
      animation: fadeUp 1.3s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .landing-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 400; color: var(--parchment);
      letter-spacing: 0.06em; line-height: 1.05;
    }
    .landing-title em {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(2.7rem, 7vw, 5.8rem); font-weight: 300;
      color: var(--warm); letter-spacing: 0.02em;
      text-shadow: 0 0 1px rgba(26,22,20,0.6), 0 1px 3px rgba(26,22,20,0.35);
    }

    /* Enter button — always centred below title */
    .enter-wrap {
      margin-top: 2.4rem;
      opacity: 0; transform: translateY(16px);
    }
    .enter-wrap.ready {
      animation: fadeUp 1.3s cubic-bezier(0.16,1,0.3,1) 0.25s forwards;
    }

    .enter-btn {
      display: inline-block;
      font-family: 'Cinzel', serif; font-size: 0.72rem;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: rgba(245,240,232,0.75);
      border: 1px solid rgba(245,240,232,0.35);
      padding: 0.75rem 2rem; text-decoration: none;
      position: relative; overflow: hidden;
      transition: color 0.3s, border-color 0.3s;
      white-space: nowrap;
    }
    .enter-btn::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(245,240,232,0.85); transform: translateX(-101%);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); z-index: 0;
    }
    .enter-btn:hover { color: var(--ink); border-color: rgba(245,240,232,0.6); }
    .enter-btn:hover::before { transform: translateX(0); }
    .enter-btn span { position: relative; z-index: 1; }

    /* Desktop: title top-left, button bottom-centre */
    @media (min-width: 1025px) {
      .landing {
        align-items: flex-start;
        justify-content: flex-start;
        padding-top: 6vh;
        padding-left: 4vw;
      }
      .landing-content { text-align: left; }
      .enter-wrap {
        position: absolute;
        bottom: 3.5rem;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 0;
      }
      .enter-wrap.ready {
        animation: fadeUpDesktop 1.3s cubic-bezier(0.16,1,0.3,1) 0.25s forwards;
      }
    }

    /* Language show/hide */
    [data-lang] { display: none; }
    body.lang-en  [data-lang="en"]  { display: inline; }
    body.lang-est [data-lang="est"] { display: inline; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUpDesktop {
      to { opacity: 0.85; transform: translateX(-50%) translateY(0); }
    }

    /* Small phones */
    @media (max-width: 390px) {
      .landing { padding-top: 8vh; }
    }
  </style>
</head>

<body class="lang-en">

  <img class="bg-photo" alt="" aria-hidden="true">
  <div class="bg-overlay" aria-hidden="true"></div>

  <div class="landing">

    <div class="lang-row" aria-label="Language selector">
      <button class="lang-btn active" data-lang-switch="en" type="button">EN</button>
      <span class="lang-separator">|</span>
      <button class="lang-btn" data-lang-switch="est" type="button">EST</button>
    </div>

    <div class="landing-content">
      <h1 class="landing-title">Duo <em>En<br>Passant</em></h1>
    </div>

    <div class="enter-wrap">
      <a href="site.html" class="enter-btn">
        <span data-lang="en">Enter</span>
        <span data-lang="est">Sisene</span>
      </a>
    </div>

  </div>

  <script>
    const body = document.body;

    function setLang(lang) {
      body.classList.toggle('lang-en',  lang === 'en');
      body.classList.toggle('lang-est', lang === 'est');
      localStorage.setItem('dep-lang', lang);
      document.querySelectorAll('[data-lang-switch]').forEach(b => {
        b.classList.toggle('active', b.dataset.langSwitch === lang);
      });
    }
    const saved = localStorage.getItem('dep-lang');
    if (saved) setLang(saved);
    document.querySelectorAll('[data-lang-switch]').forEach(btn => {
      btn.addEventListener('click', () => setLang(btn.dataset.langSwitch));
    });

    // Photo selection based on screen width
    const bgImg = document.querySelector('.bg-photo');

    function applyPhoto() {
      const isMobile = window.innerWidth < 1025;
      bgImg.classList.toggle('mobile-contain', isMobile);
      const src = isMobile ? '002.jpg' : '001.jpg';
      if (bgImg.src !== src) bgImg.src = src;
    }

    applyPhoto();
    window.addEventListener('resize', applyPhoto);
    window.addEventListener('orientationchange', () => setTimeout(applyPhoto, 150));

    // Reveal content after image loads
    const revealTargets = document.querySelectorAll('.landing-content, .enter-wrap');
    function revealContent() {
      revealTargets.forEach(el => el.classList.add('ready'));
    }
    if (bgImg.complete && bgImg.src) {
      revealContent();
    } else {
      bgImg.addEventListener('load', revealContent);
      setTimeout(revealContent, 3000);
    }
  </script>

</body>
</html>
